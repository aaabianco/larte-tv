<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>L'ARTE — Menu Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* TV em quiosque: nada de barras, nada de cursor, nada de branco piscando. */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0a0a0a; overflow: hidden; cursor: none; }
  .quadro {
    position: absolute; inset: 0;
    background-position: center; background-repeat: no-repeat; background-size: contain;
    background-color: #0a0a0a;
    opacity: 0; transition: opacity 1.2s ease-in-out;
  }
  .quadro.visivel { opacity: 1; }
  /* O vídeo cobre o carrossel enquanto está no ar; fora do prazo some. */
  #video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; background: #0a0a0a; display: none;
  }
  #video.visivel { display: block; }
  #aviso {
    position: absolute; right: 12px; bottom: 8px; color: #333; font: 12px sans-serif;
    opacity: 0; transition: opacity .5s;
  }
</style>
</head>
<body>
  <!-- Dois quadros alternam por crossfade; nunca há tela vazia entre slides. -->
  <div class="quadro" id="a"></div>
  <div class="quadro" id="b"></div>
  <video id="video" loop playsinline preload="auto"></video>
  <div id="aviso"></div>

<script>
(() => {
  'use strict';
  /**
   * Player do menu board com GRADE DE PROGRAMAÇÃO.
   *
   * Papel da TV vem da URL:
   *   ?tv=1..6     → playlist do daypart/tipo de dia corrente (grade.json)
   *   (a TV 1 já foi travada em "promo"; hoje segue o horário como as outras)
   *   ?agora=ISO   → SÓ PARA TESTE: simula o relógio (segue andando a partir
   *                  do instante passado, então as viradas acontecem de verdade)
   *
   * A cada 10 min busca slides.json + grade.json + feriados.json com
   * cache-busting; mudou, troca o conteúdo SEM recarregar a página. A troca
   * de playlist no horário de virada é verificada a cada 30 s e acontece no
   * próximo avanço do carrossel — sem reload, sem piscar.
   *
   * Fora de horário: playlist "institucional". Sem rede: segue no último
   * conteúdo guardado (memória + localStorage).
   */
  const INTERVALO_BUSCA_MS = 10 * 60 * 1000;
  const INTERVALO_GRADE_MS = 30 * 1000;
  const SEGUNDOS_PADRAO = 7;
  const HORA_DO_RELOAD = 4; // 04h — loja fechada

  const params = new URLSearchParams(location.search);
  /*
   * O NÚMERO DA TV FICA GUARDADO NO APARELHO (o dono, 29/10: mexeu no controle,
   * a página fechou e o endereço com ?tv= sumiu). Aberta uma vez com ?tv=N
   * (ou pelo atalho /N), a TV lembra; depois basta abrir o endereço puro.
   */
  let tvGuardada = null;
  try { tvGuardada = localStorage.getItem('tvNumero'); } catch (e) {}
  if (params.has('tv')) { try { localStorage.setItem('tvNumero', params.get('tv')); } catch (e) {} }
  const tvEscolhida = params.get('tv') || tvGuardada;
  const TV = Math.max(1, parseInt(tvEscolhida || '2', 10) || 2);

  // Relógio: real, ou simulado que ANDA (para provar as viradas em teste).
  const baseSimulada = params.get('agora') ? new Date(params.get('agora')) : null;
  const t0 = Date.now();
  const agora = () =>
    baseSimulada && !isNaN(baseSimulada)
      ? new Date(baseSimulada.getTime() + (Date.now() - t0))
      : new Date();

  const quadros = [document.getElementById('a'), document.getElementById('b')];
  const aviso = document.getElementById('aviso');
  const video = document.getElementById('video');
  const videosQueFalharam = new Set(); // aparelho que não toca o arquivo: volta às fotos
  let ativo = 0;
  let manifesto = new Map(); // arquivo → segundos
  let grade = null;          // grade.json
  let feriados = new Set();  // datas AAAA-MM-DD
  let playlistNome = '';     // qual playlist está no ar
  let slides = [];           // [{arquivo, segundos}] da playlist corrente
  let indice = 0;
  let timer = null;
  let recarregouHoje = false;

  const guardar = (chave, texto) => { try { localStorage.setItem(chave, texto); } catch (e) {} };
  const guardado = (chave) => { try { return localStorage.getItem(chave); } catch (e) { return null; } };

  // ------------------------------------------------------------ grade
  const minutos = (hhmm) => {
    const [h, m] = String(hhmm).split(':').map(Number);
    return (h || 0) * 60 + (m || 0);
  };
  const dataISO = (d) =>
    d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

  /** Qual playlist esta TV deve exibir NESTE instante. */
  function playlistAlvo() {
    if (!grade) return null;
    /*
     * TODAS as TVs seguem o horário, inclusive a 1.
     *
     * Ela era travada em "promo" desde o começo, e o dono corrigiu: as
     * promoções ele carrega DENTRO da grade do horário, conforme o que quer
     * anunciar naquele turno. Uma TV com playlist fixa obrigava a mexer em
     * dois lugares para mudar uma coisa só — e a de número 1 é justamente a da
     * entrada, a que mais muda.
     *
     * A playlist "promo" continua existindo: agora é escolha de grade, não
     * destino de aparelho.
     */
    const d = agora();
    const min = d.getHours() * 60 + d.getMinutes();
    const fds = d.getDay() === 0 || d.getDay() === 6 || feriados.has(dataISO(d));
    const tipo = fds ? 'fds_feriado' : 'util';
    for (const [nome, faixa] of Object.entries(grade.dayparts || {})) {
      if (min >= minutos(faixa.inicio) && min < minutos(faixa.fim)) {
        /*
         * CADA TV PODE TER A SUA GRADE, e a maioria não tem.
         *
         * `porTv` é a exceção declarada: se esta TV tiver playlist própria
         * para este horário, ela manda; se não tiver, cai no `mapa` comum,
         * que é o que as seis usam hoje. Assim dar grade própria a UMA TV não
         * obriga a montar as seis, e a casa que nunca precisar disso continua
         * com um arquivo simples.
         */
        const propria = ((grade.porTv || {})[String(TV)] || {})[nome];
        if (propria && propria[tipo]) return propria[tipo];
        return (grade.mapa?.[nome] || {})[tipo] || null;
      }
    }
    return 'institucional'; // fora de qualquer daypart
  }

  /** Materializa a playlist corrente a partir do manifesto (ou do nome cru). */
  function montarSlides(nome) {
    const arquivos = (grade?.playlists || {})[nome] || [];
    return arquivos.map((a) => ({ arquivo: a, segundos: manifesto.get(a) ?? SEGUNDOS_PADRAO }));
  }

  /**
   * QUANTO TEMPO CADA FOTO FICA NA TELA — parâmetro da loja, não do código.
   *
   * `segundos` na grade.json vale para todas as fotos de todas as TVs (o dono,
   * 17/10: "aumentar o tempo que cada tela vai aparecendo, coloca como
   * parâmetro"). Sem ele, vale o tempo de cada slide no slides.json, como
   * sempre foi. Fora de 3..120 s é erro de digitação: ignora.
   */
  function tempoDe(s) {
    const g = Number(grade && grade.segundos);
    if (g >= 3 && g <= 120) return g;
    return s.segundos || SEGUNDOS_PADRAO;
  }

  /** Verificada a cada 30 s; a troca vale a partir do próximo avanço. */
  // Estado inspecionável (suporte e validação): que playlist está no ar?
  window.estadoTv = () => ({
    tv: TV,
    relogio: agora().toString(),
    playlist: playlistNome,
    video: video.classList.contains('visivel') ? video.dataset.arquivo : null,
    videoTocando: !video.paused,
    videoMudo: video.muted,
    videoSegundo: video.currentTime,
    slides: slides.map((s) => s.arquivo),
  });

  function aplicarGrade() {
    const alvo = playlistAlvo();
    if (!alvo) return;
    const novos = montarSlides(alvo);
    if (!novos.length) return; // playlist vazia: fica onde está
    /*
     * Mesma playlist com fotos diferentes também é troca: antes só o NOME
     * contava, e uma foto posta na lista do horário só aparecia na virada
     * seguinte ou quando alguém religava a TV.
     */
    const iguais = alvo === playlistNome
      && novos.map((s) => s.arquivo).join('|') === slides.map((s) => s.arquivo).join('|');
    if (iguais) return;
    playlistNome = alvo;
    slides = novos;
    indice = 0;
    // pré-carrega a playlist que entrou
    novos.forEach((s) => { const im = new Image(); im.src = s.arquivo; });
  }

  // ------------------------------------------------------------ vídeo
  /**
   * UM VÍDEO EM LOOP NUMA TV, COM PRAZO (o dono, 29/10: "este vídeo na TV 2
   * direto, de hoje até sábado à noite").
   *
   * grade.json → "videos": [{ "tv": "2", "arquivo": "x.mp4", "de": ISO, "ate": ISO }]
   * Dentro do prazo o vídeo cobre o carrossel, em qualquer horário (a grade
   * do almoço/noite não manda nele). Passou o "ate", a TV volta sozinha para
   * as fotos — ninguém precisa lembrar de tirar. Sem som: o navegador da TV
   * só toca sozinho vídeo mudo.
   */
  function videoAlvo() {
    // Sem ?tv= na URL a página cai na TV 2 por padrão; o vídeo só vai para quem pediu.
    if (!tvEscolhida) return null;
    const t = agora().getTime();
    for (const v of (grade && grade.videos) || []) {
      if (String(v.tv) !== String(TV) || !v.arquivo || videosQueFalharam.has(v.arquivo)) continue;
      const de = v.de ? new Date(v.de).getTime() : -Infinity;
      const ate = v.ate ? new Date(v.ate).getTime() : Infinity;
      if (t >= de && t < ate) return v.arquivo;
    }
    /*
     * PLAYLIST QUE VIROU VÍDEO (o dono, 29/10, TV 1). Vídeo escondido atrás das
     * fotos não segurou o Stick: ele só conta vídeo que aparece. Então a
     * playlist do horário é tocada como vídeo (gerar-videos.cjs faz um mp4
     * com as mesmas fotos); a grade do almoço/noite continua mandando.
     */
    const daPlaylist = ((grade && grade.videoDaPlaylist) || {})[playlistNome];
    if (daPlaylist && !videosQueFalharam.has(daPlaylist)) return daPlaylist;
    return null;
  }

  /*
   * COM SOM (MUDO NO ARQUIVO), NÃO "MUTED" (o dono, 29/10: o vídeo parou no Silk).
   * O Stick só conta como "tem alguém assistindo" o vídeo que toca som; vídeo
   * com muted ele deixa a tela da Amazon entrar. Os arquivos têm faixa de som
   * em silêncio (gerar-videos.cjs), então tocar sem muted não faz barulho.
   * Se o navegador recusar som sem um toque no controle, toca muted e tenta
   * de novo no primeiro botão apertado.
   */
  function tocar() {
    video.muted = false;
    video.volume = 1;
    return video.play().catch(() => { video.muted = true; return video.play().catch(() => {}); });
  }
  /*
   * O OK DO CONTROLE PÕE O VÍDEO EM TELA CHEIA (o dono, 29/10: a tela da Amazon
   * ainda entrava). Vídeo em tela cheia é o modo de "assistir" do aparelho;
   * tela cheia só pode ser pedida com um botão apertado, por isso aqui.
   */
  function telaCheia() {
    const el = video.classList.contains('visivel') ? video : document.documentElement;
    if (document.fullscreenElement === el) return;
    const pede = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitEnterFullscreen;
    try { const p = pede && pede.call(el); if (p && p.catch) p.catch(() => {}); } catch (e) {}
  }
  ['keydown', 'click', 'pointerdown'].forEach((ev) =>
    window.addEventListener(ev, () => {
      if (!video.dataset.arquivo) return;
      if (video.muted || video.paused) tocar();
      telaCheia();
    }));

  /*
   * AVISA O APARELHO QUE HÁ MÍDIA TOCANDO (Media Session), como faz o app do
   * YouTube; é o que o sistema da TV olha antes de pôr a tela da Amazon.
   */
  function avisarMidia() {
    if (!('mediaSession' in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({ title: "L'ARTE Gourmet", artist: 'TV ' + TV });
      navigator.mediaSession.playbackState = video.paused ? 'paused' : 'playing';
      navigator.mediaSession.setActionHandler('pause', () => tocar());
    } catch (e) {}
  }
  video.addEventListener('playing', avisarMidia);
  video.addEventListener('pause', avisarMidia);

  /** true = o vídeo está no ar e o carrossel espera. */
  function cuidarDoVideo() {
    const alvo = videoAlvo();
    if (!alvo) {
      if (video.classList.contains('visivel')) {
        video.pause();
        video.removeAttribute('src');
        delete video.dataset.arquivo;
        video.load();
        video.classList.remove('visivel');
        // vídeo saiu do ar (prazo acabou): sai da tela cheia, as fotos voltam
        if (document.fullscreenElement === video) document.exitFullscreen().catch(() => {});
      }
      return false;
    }
    if (video.dataset.arquivo !== alvo) {
      video.dataset.arquivo = alvo;
      video.src = alvo;
    }
    video.classList.add('visivel');
    if (video.paused || video.muted) tocar();
    return true;
  }
  /*
   * NUNCA PARAR NO FIM. No YouTube, quando o vídeo acabava, entrava a tela de
   * sugestões por cima (o dono, 29/10). Aqui o loop é do próprio navegador;
   * se algum aparelho ignorar o loop e soltar "ended", recomeça na hora.
   */
  video.addEventListener('ended', () => { video.currentTime = 0; tocar(); });
  // Travou (rede, decodificador)? Se o tempo não anda em 20 s, recarrega o arquivo.
  let ultimoSegundo = -1;
  setInterval(() => {
    if (!video.classList.contains('visivel') || !video.dataset.arquivo) return;
    if (video.currentTime === ultimoSegundo) {
      const a = video.dataset.arquivo;
      video.src = a + '?r=' + Date.now();
      tocar();
    }
    ultimoSegundo = video.currentTime;
  }, 20000);

  // Aparelho que não toca o arquivo: marca e volta para as fotos, sem tela preta.
  video.addEventListener('error', () => {
    if (!video.dataset.arquivo) return;
    videosQueFalharam.add(video.dataset.arquivo);
    delete video.dataset.arquivo;
    video.removeAttribute('src');
    video.classList.remove('visivel');
  });

  // ------------------------------------------------------------ carrossel
  function proximo() {
    if (cuidarDoVideo()) { timer = setTimeout(proximo, 15000); return; }
    if (!slides.length) { timer = setTimeout(proximo, 2000); return; }
    const s = slides[indice % slides.length];
    indice = (indice + 1) % slides.length;
    const entra = quadros[1 - ativo];
    const sai = quadros[ativo];
    entra.style.backgroundImage = "url('" + s.arquivo + "')";
    requestAnimationFrame(() => {
      entra.classList.add('visivel');
      sai.classList.remove('visivel');
      ativo = 1 - ativo;
    });
    timer = setTimeout(proximo, tempoDe(s) * 1000);
  }

  // ------------------------------------------------------------ conteúdo
  function aplicarManifesto(texto) {
    let dados;
    try { dados = JSON.parse(texto); } catch (e) { return; }
    if (!dados || !Array.isArray(dados.slides)) return;
    guardar('slides', texto);
    manifesto = new Map(dados.slides.map((s) => [s.arquivo, s.segundos]));
  }
  function aplicarGradeJson(texto) {
    let dados;
    try { dados = JSON.parse(texto); } catch (e) { return; }
    if (!dados || !dados.playlists) return;
    guardar('grade', texto);
    grade = dados;
  }
  function aplicarFeriados(texto) {
    let dados;
    try { dados = JSON.parse(texto); } catch (e) { return; }
    if (!dados || !Array.isArray(dados.datas)) return;
    guardar('feriados', texto);
    feriados = new Set(dados.datas);
  }

  async function buscar() {
    const v = '?v=' + Date.now();
    let falhou = false;
    for (const [arquivo, aplicar] of [
      ['slides.json', aplicarManifesto],
      ['grade.json', aplicarGradeJson],
      ['feriados.json', aplicarFeriados],
    ]) {
      try {
        const r = await fetch(arquivo + v, { cache: 'no-store' });
        if (r.ok) aplicar(await r.text());
      } catch (e) { falhou = true; }
    }
    aviso.textContent = falhou ? 'offline' : '';
    aviso.style.opacity = falhou ? '1' : '0';
    // Conteúdo novo pode mudar a playlist corrente (ex.: slide trocado).
    const nomeAtual = playlistNome;
    playlistNome = '';
    aplicarGrade();
    if (!playlistNome) playlistNome = nomeAtual;
  }

  function vigiarMadrugada() {
    const h = agora().getHours();
    if (h === HORA_DO_RELOAD && !recarregouHoje) {
      recarregouHoje = true;
      if (!baseSimulada) location.reload();
    }
    if (h !== HORA_DO_RELOAD) recarregouHoje = false;
  }

  /*
   * O aparelho da loja cai da rede sozinho, e reiniciar sem internet abria
   * tela de erro — alguém tinha que redigitar o endereço no controle remoto.
   * Com o service worker a página fica gravada no Stick e abre offline.
   * Falhar aqui não pode derrubar o player: sem ele tudo segue como antes.
   */
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  /**
   * A TV NÃO PODE DORMIR. O Fire TV Stick entra em repouso sozinho quando
   * ninguém mexe no controle — e um carrossel de fotos não conta como vídeo
   * tocando. A TV mostra "sem sinal" e alguém tem de religar tudo (o dono,
   * 17/10). O pedido de tela acordada (Screen Wake Lock) segura o Stick
   * enquanto a página está aberta; o navegador o solta quando a página some,
   * então ele é pedido de novo ao voltar e conferido de minuto em minuto.
   * Falhar aqui não pode derrubar o player.
   */
  let travaDaTela = null;
  const manterAcordada = async () => {
    try {
      if (!('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
      if (travaDaTela && !travaDaTela.released) return;
      travaDaTela = await navigator.wakeLock.request('screen');
    } catch (e) { /* sem suporte ou recusado: segue sem */ }
  };
  document.addEventListener('visibilitychange', manterAcordada);
  manterAcordada();
  setInterval(manterAcordada, 60 * 1000);

  // Arranque: o que estiver guardado (funciona offline), depois a rede.
  const s0 = guardado('slides'); if (s0) aplicarManifesto(s0);
  const g0 = guardado('grade'); if (g0) aplicarGradeJson(g0);
  const f0 = guardado('feriados'); if (f0) aplicarFeriados(f0);
  aplicarGrade();
  proximo();
  buscar().then(() => { aplicarGrade(); });
  setInterval(buscar, INTERVALO_BUSCA_MS);
  setInterval(aplicarGrade, INTERVALO_GRADE_MS);
  setInterval(vigiarMadrugada, 60 * 1000);
})();
</script>
</body>
</html>
